<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>petri: reaction-diffusion playground</title>
  <meta name="description" content="Grow coral, fingerprints and dividing cells in your browser. A Gray-Scott reaction-diffusion sandbox running on WebGL2.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2304060c' stroke='%239fe7d0' stroke-width='2'/%3E%3Ccircle cx='11' cy='13' r='3' fill='%239fe7d0'/%3E%3Ccircle cx='20' cy='11' r='2' fill='%231f8a8a'/%3E%3Ccircle cx='19' cy='20' r='4' fill='%239fe7d0'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="stage" aria-label="Reaction-diffusion simulation"></canvas>

  <aside id="panel" class="panel">
    <header class="panel-head">
      <h1>petri<em>.</em></h1>
      <button id="act-collapse" class="icon" title="Collapse panel" aria-label="Collapse panel">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="panel-body">
      <p id="readout" class="readout"></p>

      <section>
        <h2>species</h2>
        <div id="presets" class="chips"></div>
      </section>

      <section>
        <h2>stain</h2>
        <div id="palettes" class="swatches"></div>
      </section>

      <section>
        <h2>chemistry</h2>
        <div id="sliders" class="sliders"></div>
        <label class="select">
          <span>resolution</span>
          <select id="resolution">
            <option value="0.25">coarse</option>
            <option value="0.35">medium</option>
            <option value="0.5">fine</option>
            <option value="0.75">ultra</option>
          </select>
        </label>
      </section>

      <section>
        <h2>culture <span id="seed-label" class="dim"></span></h2>
        <div id="seeds" class="chips"></div>
        <form id="text-seed" class="text-seed">
          <input type="text" placeholder="grow a word…" maxlength="24" aria-label="Seed text">
          <button type="submit">plant</button>
        </form>
      </section>

      <section class="actions">
        <button id="act-map" title="Explore the feed/kill map [M]">parameter map</button>
        <button id="act-pause" title="[Space]">pause</button>
        <button id="act-snap" title="[S]">snapshot</button>
        <button id="act-share">copy link</button>
      </section>

      <footer class="foot">
        <span><b id="fps">–</b> fps</span>
        <span>drag paint · shift erase · <kbd>1-9</kbd> species · <kbd>H</kbd> hide</span>
      </footer>
    </div>
  </aside>

  <div class="map-axes" aria-hidden="true">
    <span class="ax-x">kill →</span>
    <span class="ax-y">feed →</span>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <div id="error" class="error"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
